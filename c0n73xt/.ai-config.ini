; AI Chat Configuration
; Edit ini untuk ganti model / endpoint
;
; AI_API_KEY  : API key dari provider AI lu (OpenAI-compatible)
; AI_ENDPOINT : endpoint chat completions (OpenAI-compatible /v1/chat/completions)
; AI_MODEL    : nama model yang mau dipakai
;
; Contoh endpoint lokal:  http://localhost:8642/v1/chat/completions

AI_API_KEY=YOUR_API_KEY_HERE
AI_ENDPOINT=https://api.openai.com/v1/chat/completions
AI_MODEL=gpt-4o-mini
